<!-- Source of og-image.png (1200x630), the social card this site's meta tags
     point at. Edit here and re-rasterise; no social platform renders an SVG,
     so the PNG next to it is what ships:

       node -e "require('sharp')('og-image.svg').png().resize(1200,630).toFile('og-image.png')"

     The palette is subs' own (styles.css): the bg-primary #0d0d0f, the bg-card
     #1c1c21, and the violet/orange accents the totals use. Fonts are the plain
     system stack on purpose: librsvg resolves fonts through the OS and
     silently falls back, and a social card is the one image nobody proofreads. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#1c1c21"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#7f5af0"/>
  <text x="90" y="130" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#7f5af0" letter-spacing="6">GEEKNITE</text>
  <text x="90" y="300" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="#fffffe">Subscription Cost Calculator</text>
  <text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#94a1b2">What every subscription you forgot about actually costs</text>
  <text x="90" y="444" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#94a1b2">you in a year. It might hurt.</text>
  <rect x="90" y="530" width="120" height="6" fill="#ff8906"/>
  <text x="90" y="586" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#94a1b2">subs.geeknite.com</text>
</svg>
